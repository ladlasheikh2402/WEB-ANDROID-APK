<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Redirecting…</title>
  <script>
    /* the signup page now lives inside index.html  ->  /#/signup  (keeps ?next=…) */
    var q = new URLSearchParams(location.search).get('next');
    location.replace('/#/signup' + (q ? '?next=' + encodeURIComponent(q) : ''));
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/#/signup" /></noscript>
</head>
<body><a href="/#/signup">Continue</a></body>
</html>
